name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # Todos los valores de abajo son ficticios/sandbox — NO son
      # secretos reales, por eso van en texto plano en el workflow
      # y no en GitHub Secrets. Si algún día se necesitan credenciales
      # reales en CI (ej. para tests de integración contra Wompi
      # sandbox real), esos sí deben moverse a Secrets.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/hallyboutique_ci"
      JWT_SECRET: "ci-test-secret-not-real"
      JWT_EXPIRES_IN: "15m"
      JWT_ISSUER: "hallyboutique-api"
      JWT_AUDIENCE: "hallyboutique-web"
      REFRESH_TOKEN_EXPIRES_IN_DAYS: "30"
      CORS_ORIGIN: "http://localhost:5173"
      WOMPI_PUBLIC_KEY: "pub_test_ci"
      WOMPI_PRIVATE_KEY: "prv_test_ci"
      WOMPI_INTEGRITY_SECRET: "test_integrity_ci"
      WOMPI_EVENTS_SECRET: "test_events_ci"
      WOMPI_REDIRECT_URL: "http://localhost:5173/order/confirmation"
      WOMPI_API_BASE_URL: "https://sandbox.wompi.co/v1"
      ENVIA_TOKEN: "ci-test-token"
      ENVIA_BASE_URL: "https://api-test.envia.com"
      TAX_RATE: "0.19"
      FREE_SHIPPING_THRESHOLD: "150000"
      SHIPPING_ORIGIN_NUMBER: "123"
      SHIPPING_ORIGIN_NAME: "Hally Boutique CI"
      SHIPPING_ORIGIN_PHONE: "+573000000000"
      SHIPPING_ORIGIN_STREET: "Calle Test"
      SHIPPING_ORIGIN_CITY: "Bogota"
      SHIPPING_ORIGIN_STATE: "DC"
      SHIPPING_ORIGIN_COUNTRY: "CO"
      SHIPPING_ORIGIN_POSTALCODE: "110111"
      SHIPPING_CARRIERS: "coordinadora,serviEntrega,interRapidisimo,tcc"
      JOB_POLL_INTERVAL_MS: "10000"
      JOB_BATCH_SIZE: "5"
      RESEND_API_KEY: "re_ci_test_not_real"
      EMAIL_FROM: "test@ci.hallyboutique.local"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test
