<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba de Checkout — Wompi Sandbox</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 20px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 12px 24px; background: #5b3fd6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    small { color: #666; }
  </style>
</head>
<body>
  <h2>Checkout de prueba (Wompi Sandbox)</h2>
  <p><small>Pega aquí exactamente los valores que te devolvió <code>POST /orders/:orderId/checkout</code>.</small></p>

  <form method="GET" action="https://checkout.wompi.co/p/">
    <label>Public Key</label>
    <input type="text" name="public-key" required />

    <label>Currency</label>
    <input type="text" name="currency" value="COP" required />

    <label>Amount in Cents</label>
    <input type="number" name="amount-in-cents" required />

    <label>Reference</label>
    <input type="text" name="reference" required />

    <label>Signature (integrity)</label>
    <input type="text" name="signature:integrity" required />

    <!--<label>Redirect URL</label>
    <input type="text" name="redirect-url" value="http://localhost:3000/api/payments/redirect" required />-->

    <button type="submit">Ir a pagar (Wompi Sandbox)</button>
  </form>
</body>
</html>
